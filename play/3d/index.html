<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>调度台 3D · 宝鸡站</title>
<style>
:root{--bg:#0b0d0f;--panel:#12161a;--line:#2a3036;--text:#d8d6ce;--dim:#858b8f;--amber:#c9a45c;--red:#b23a2b;--green:#5f8f72}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
header{position:fixed;left:0;right:0;top:0;height:54px;background:#0d1013;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 16px;z-index:20}
.brand{display:flex;align-items:baseline;gap:10px;min-width:210px}
.brand b{font-size:19px;letter-spacing:2px}
.brand span{font:11px/1 ui-monospace,monospace;color:var(--dim);letter-spacing:1px}
.clock{font:600 24px/1 ui-monospace,monospace;color:#e8e4d8}
.meta{font:11px/1.4 ui-monospace,monospace;color:var(--dim)}
.meta b{display:block;color:#c9c6bb;font-size:12px}
.spacer{flex:1}
button{background:#171c21;border:1px solid #333a41;color:#d9d6cc;height:30px;padding:0 11px;font:12px/1 "Noto Sans SC",sans-serif;cursor:pointer}
button:hover{border-color:#6c747b;background:#1d242a}
button.on{border-color:var(--amber);color:#f0d9a7;background:#211d16}
#side{position:fixed;right:14px;top:66px;width:258px;background:rgba(14,18,21,.94);border:1px solid var(--line);z-index:15;padding:12px}
#side h3{margin:0 0 8px;font-size:13px;letter-spacing:1px;color:#bfbcb2}
#side .no{font:600 22px/1 ui-monospace,monospace;color:#f0eadb;margin-bottom:5px}
#side .rows{font:11px/1.9 ui-monospace,monospace;color:#a9ada8}
#side .rows i{display:inline-block;width:54px;color:#6f777a;font-style:normal}
#side .task{margin-top:8px;padding-top:8px;border-top:1px solid #252b30;font-size:11px;color:#9ca29f}
#log{position:fixed;left:14px;bottom:12px;width:330px;max-height:145px;overflow:hidden;background:rgba(13,17,20,.9);border:1px solid var(--line);padding:7px 9px;font:11px/1.55 ui-monospace,monospace;color:#989e9a;z-index:15}
#log b{color:#c9a45c;font-weight:400}
#legend{position:fixed;right:14px;bottom:12px;background:rgba(13,17,20,.9);border:1px solid var(--line);padding:7px 9px;font:11px/1.6 ui-monospace,monospace;color:#868d8d;z-index:15}
#legend span{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}
#tip{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:11px/1 ui-monospace,monospace;color:#626a6c;z-index:12;pointer-events:none}
#loading{position:fixed;inset:0;background:#0b0d0f;display:flex;align-items:center;justify-content:center;z-index:40;font:12px/1.6 ui-monospace,monospace;color:#8a8f8b;letter-spacing:1px}
#loading.hidden{display:none}
@media(max-width:760px){
 header{height:48px;gap:8px;padding:0 9px}.brand{min-width:0}.brand b{font-size:15px}.brand span{display:none}
 .clock{font-size:19px}.meta{display:none}
 #side{right:7px;top:56px;width:190px;padding:9px}#side .rows{font-size:10px}
 #log{left:7px;bottom:7px;width:calc(100% - 14px);max-height:90px;font-size:10px}
 #legend,#tip{display:none}
 .hide-m{display:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <div class="brand"><b>调度台</b><span>3D / BAOJI</span></div>
  <div class="clock" id="clock">06:00</div>
  <div class="meta"><b id="mode">宝鸡站 · 客运场</b><span id="count">在站 0 / 待接 0</span></div>
  <div class="spacer"></div>
  <button id="pause">暂停</button>
  <button class="sp" data-s="1">×1</button>
  <button class="sp on" data-s="5">×5</button>
  <button class="sp" data-s="10">×10</button>
  <button class="sp hide-m" data-s="20">×20</button>
  <button id="follow" class="hide-m">跟车</button>
  <button id="reset" class="hide-m">全景</button>
  <button id="to2d">2D</button>
  <button id="todrive" onclick="location.href='drive.html'">HXD3D 驾驶</button>
</header>
<div id="side">
  <h3>列车</h3>
  <div class="no" id="selNo">未选择</div>
  <div class="rows" id="selRows"><i>状态</i>点一列车查看</div>
  <div class="task" id="selTask">拖动旋转 · 滚轮缩放 · 点车选中</div>
</div>
<div id="log"></div>
<div id="legend"><span style="background:#5f8f72"></span>空闲 <span style="background:#b23a2b;margin-left:10px"></span>占用 <br>黄线为站台安全线</div>
<div id="tip">拖动旋转 · 滚轮缩放 · 右键平移 · 点击列车跟车</div>
<div id="loading">正在建立宝鸡站三维站场…</div>

</body>
</html>
