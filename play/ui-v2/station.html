<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宝鸡站 · 枢纽总图</title>
<link rel="stylesheet" href="station-map.css">
<style>
:root{--ink:#2b2d27;--paper:#efe8d6;--muted:#7b7562;--red:#a63a2e;--line:#8d856f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#191a16;color:var(--ink);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;overflow:hidden}
.shell{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
.bar{display:flex;align-items:center;gap:18px;padding:0 18px;background:#20211c;border-bottom:1px solid #0d0e0b;color:#e8e0cb}
.bar .mark{font-family:"Noto Serif SC",serif;font-size:22px;border:1px solid #8d856f;padding:3px 9px}
.bar b{font-family:"Noto Serif SC",serif;font-size:19px;letter-spacing:2px}
.bar span{font:9px "Roboto Mono",monospace;color:#a49c85;letter-spacing:1px}
.bar em{margin-left:auto;font-style:normal;font:9px "Roboto Mono",monospace;color:#a49c85}
.map{min-height:0;padding:10px 12px 12px}
#map{width:100%;height:100%}
@media(max-width:860px){
  .shell{grid-template-rows:50px minmax(0,1fr)}
  .bar{padding:0 10px;gap:10px}
  .bar b{font-size:16px}
  .bar span{display:none}
  .map{padding:6px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="mark">调</div>
    <b>宝鸡站 · 枢纽总图</b>
    <span>16 道 / 4 台 / 客运场 · 货场 · 机务段 · 存车场 · 上下咽喉</span>
    <em>拖动 · 滚轮缩放 · 角落定位</em>
  </header>
  <main class="map" id="map"></main>
</div>
<script src="station-map.js"></script>
<script>createStationMap(document.getElementById('map'),{station:'宝鸡',tracks:16})</script>
</body>
</html>
