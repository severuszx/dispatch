<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>宝鸡站 · 站场线条</title>
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="topology.css">
<style>
html,body{margin:0;height:100%;background:#20211b;color:#f4f0e4;font-family:"Noto Sans SC",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid #4a4b40;background:#26271f;flex:none}
.bar h1{margin:0;font:700 15px "Noto Serif SC",serif;letter-spacing:.08em;color:#f4f0e4}
.bar .sub{font:10px "Roboto Mono",monospace;color:#aaa58f}
.bar .tag{margin-left:auto;border:1px solid #6f6b56;padding:2px 7px;font:9px "Roboto Mono",monospace;color:#c8c2a9}
.stage{flex:1;min-height:0;padding:8px;display:flex;flex-direction:column;height:100%}
#topo{flex:1;min-height:0;min-width:0;height:auto}
body.embed .bar{display:none}
body.embed .stage{position:fixed;inset:0;display:block;padding:0;height:auto}
body.embed #topo{height:100%;width:100%}
@media(max-width:760px){.bar{padding:6px 8px;gap:8px}.bar h1{font-size:12px}.bar .sub{display:none}.bar .tag{font-size:8px;padding:2px 5px}.stage{padding:4px}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <h1>宝鸡站</h1>
    <div class="sub">6台10线 · 陇海 / 宝成 / 宝中</div>
    <div class="tag">站场线条 · v0.6.18</div>
  </div>
  <div class="stage" id="topo"></div>
</div>
<script src="topology.js"></script>
<script>
const params = new URLSearchParams(location.search);
const embed = params.has('embed');
if (embed) document.body.classList.add('embed');
const api = createTopology(document.getElementById('topo'));
const f = params.get('focus');
if (f) { const i = ['all','station','pax','west','east','storage','freight','engine','k101','k105','w1'].indexOf(f); if (i >= 0) setTimeout(() => api.focus(i), 120); }
</script>
</body>
</html>
