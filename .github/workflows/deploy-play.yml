name: deploy-play
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://aka.doubaocdn.com/s/9n9gqEHsdI -o /tmp/game.zip
      - run: rm -rf play/assets play/data play/manage play/packs play/ui-v2 play/index.html
      - run: unzip -q /tmp/game.zip -d play
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A play
          git diff --cached --quiet || git commit -m "play: sync 0.6.19 web build"
          git push
