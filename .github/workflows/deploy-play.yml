name: deploy-play
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -q "scene.autoDemo" play/assets/js/sim.js; then
            echo "already patched"
            exit 0
          fi
          python3 .github/patch-demo.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add play
          git diff --cached --quiet || git commit -m "play: 0.6.20 auto dispatch [skip ci]"
          git push
